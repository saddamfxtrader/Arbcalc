<script>
(function buildIcon() {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="96" fill="#0b1a33"/>
        <text x="50%" y="44%" font-family="Segoe UI, Arial, sans-serif"
              font-size="120" font-weight="700" fill="#ffffff"
              text-anchor="middle" dominant-baseline="middle">P2P</text>
        <text x="50%" y="72%" font-family="Segoe UI, Arial, sans-serif"
              font-size="90" font-weight="600" fill="#7fb2ff"
              text-anchor="middle" dominant-baseline="middle">৳</text>
    </svg>`;
    const dataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    const dataUriB64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    document.getElementById('favIcon').href = dataUri;
    document.getElementById('appleIcon').href = dataUriB64;

    function svgToPng(size, bg) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = c.height = size;
                const ctx = c.getContext('2d');
                if (bg) { ctx.fillStyle = bg; ctx.fillRect(0,0,size,size); }
                ctx.drawImage(img, 0, 0, size, size);
                resolve(c.toDataURL('image/png'));
            };
            img.onerror = () => resolve(dataUri);
            img.src = dataUri;
        });
    }
    const manifest = {
        name: "P2P Ad Price Calculator",
        short_name: "P2P Ad Price",
        description: "Binance P2P Dynamic Buy & Sell Ad Price Calculator",
        start_url: ".", scope: ".", display: "standalone",
        orientation: "portrait", background_color: "#f4f7fc",
        theme_color: "#0b1a33", lang: "bn", icons: []
    };
    (async () => {
        const [p192, p512] = await Promise.all([
            svgToPng(192, '#0b1a33'), svgToPng(512, '#0b1a33')
        ]);
        manifest.icons = [
            { src: p192, sizes:"192x192", type:"image/png", purpose:"any" },
            { src: p512, sizes:"512x512", type:"image/png", purpose:"any" }
        ];
        const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
        document.getElementById('appManifest').href = URL.createObjectURL(blob);
    })();
})();
</script>

<!-- MAIN LOGIC -->
<script>
(function () {
    'use strict';

    const STORAGE_KEY = 'p2pAdCalcState_v1';
    const INPUT_IDS = ['minPrice','maxPrice','buyCount','sellCount',
                       'buyInterval','sellInterval','gap'];

    const storage = {
        get(k, f){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch(e){ return f; } },
        set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
        remove(k){ try { localStorage.removeItem(k); } catch(e){} }
    };

    let lastResult = null;

    const toastEl = document.getElementById('toast');
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function fmtPrice(n) {
        // 2 দশমিক পর্যন্ত, trailing zero সরানো
        const v = Math.round(n * 1e8) / 1e8;
        return String(v);
    }

    function copyText(text, label) {
        if (!navigator.clipboard) {
            showToast('কপি সমর্থিত নয়'); return;
        }
        navigator.clipboard.writeText(text).then(() => {
            showToast((label || 'কপি') + ' হয়েছে!');
        }).catch(() => showToast('কপি ব্যর্থ, ম্যানুয়ালি কপি করুন'));
    }

    /* ========================
       VALIDATION
       ======================== */
    function readNum(id, label, { min = -Infinity, integer = false } = {}) {
        const el = document.getElementById(id);
        const raw = el.value.trim();
        el.classList.remove('invalid');
        if (raw === '') {
            el.classList.add('invalid');
            throw new Error(`${label} পূরণ করুন।`);
        }
        const v = Number(raw);
        if (!Number.isFinite(v)) {
            el.classList.add('invalid');
            throw new Error(`${label} সঠিক সংখ্যা নয়।`);
        }
        if (v < min) {
            el.classList.add('invalid');
            throw new Error(`${label} অবশ্যই ${min}-এর সমান বা বেশি হতে হবে।`);
        }
        if (integer && !Number.isInteger(v)) {
            el.classList.add('invalid');
            throw new Error(`${label} পূর্ণসংখ্যা হতে হবে।`);
        }
        return v;
    }

    /* ========================
       CALCULATION ENGINE
       ======================== */
    function calculate() {
        const minP   = readNum('minPrice', 'Minimum Market Price', { min: 0 });
        const maxP   = readNum('maxPrice', 'Maximum Market Price', { min: 0 });
        const buyCnt = readNum('buyCount', 'Total Buy Ads',   { min: 1, integer: true });
        const sellCnt= readNum('sellCount','Total Sell Ads',  { min: 1, integer: true });
        const buyIv  = readNum('buyInterval',  'Buy Price Interval',  { min: 0 });
        const sellIv = readNum('sellInterval', 'Sell Price Interval', { min: 0 });
        const gap    = readNum('gap',          'Buy–Sell Price Gap',  { min: 0 });

        if (minP >= maxP) {
            throw new Error('Minimum Price অবশ্যই Maximum Price-এর চেয়ে কম হতে হবে।');
        }

        // Buy block natural placement (from minP upward)
        const highestBuyNatural = minP + buyCnt * buyIv;
        // Sell block natural placement (from maxP downward)
        const lowestSellNatural = maxP - sellCnt * sellIv;

        if (lowestSellNatural <= highestBuyNatural) {
            throw new Error(
                'নির্ধারিত Ad সংখ্যা ও Interval অনুযায়ী মার্কেট রেঞ্জে সব Ad বসানো সম্ভব নয় ' +
                '(Buy ব্লক ও Sell ব্লক ওভারল্যাপ করছে)। Interval/Gap কমিয়ে দেখুন।'
            );
        }

        // Actual natural gap between the two blocks
        const naturalGap = lowestSellNatural - highestBuyNatural;
        // Free space to redistribute so that gap matches user input
        const freeSpace = naturalGap - gap;

        if (freeSpace < 0) {
            throw new Error(
                `প্রকৃত প্রাইস রেঞ্জে Buy-এর সর্বোচ্চ (${fmtPrice(highestBuyNatural)}) ও ` +
                `Sell-এর সর্বনিম্ন (${fmtPrice(lowestSellNatural)})-এর মাঝে gap = ` +
                `${fmtPrice(naturalGap)}, কিন্তু আপনি চেয়েছেন ${fmtPrice(gap)}। ` +
                `Gap কমান বা Ad সংখ্যা/Interval কমিয়ে দেখুন।`
            );
        }

        // Distribute free space equally at both sides of the gap
        const halfFree = freeSpace / 2;
        const buyShiftPerAd  = halfFree / buyCnt;   // shift buy block upward
        const sellShiftPerAd = halfFree / sellCnt;  // shift sell block downward

        const buyPrices = [];
        for (let i = 0; i < buyCnt; i++) {
            const price = minP + (i + 1) * buyIv + (i + 1) * buyShiftPerAd;
            buyPrices.push(price);
        }
        const sellPrices = [];
        for (let i = 0; i < sellCnt; i++) {
            const price = maxP - (i + 1) * sellIv - (i + 1) * sellShiftPerAd;
            sellPrices.push(price);
        }

        const highestBuy = Math.max(...buyPrices);
        const lowestSell = Math.min(...sellPrices);
        const actualGap = lowestSell - highestBuy;

        // Sanity
        if (buyPrices.some(p => p < minP - 1e-9 || p > maxP + 1e-9)) {
            throw new Error('গণনায় ত্রুটি: কোনো Buy Price মার্কেট রেঞ্জের বাইরে চলে গেছে।');
        }
        if (sellPrices.some(p => p < minP - 1e-9 || p > maxP + 1e-9)) {
            throw new Error('গণনায় ত্রুটি: কোনো Sell Price মার্কেট রেঞ্জের বাইরে চলে গেছে।');
        }
        if (Math.abs(actualGap - gap) > 1e-6) {
            throw new Error('গণনায় ত্রুটি: প্রকৃত Gap ইনপুট Gap-এর সঙ্গে মিলছে না।');
        }

        const minBuy = Math.min(...buyPrices);
        const maxBuy = highestBuy;
        const minSell = lowestSell;
        const maxSell = Math.max(...sellPrices);

        return {
            minP, maxP, buyCnt, sellCnt, buyIv, sellIv, gap,
            buyPrices, sellPrices,
            minBuy, maxBuy, minSell, maxSell,
            actualGap,
            freeSpaceUsed: freeSpace,
            remainingSpace: maxP - minP
        };
    }

    /* ========================
       RENDER
       ======================== */
    const resultWrap = document.getElementById('resultWrap');
    const errorBox   = document.getElementById('errorBox');
    const buyList    = document.getElementById('buyList');
    const sellList   = document.getElementById('sellList');
    const buySummary = document.getElementById('buySummary');
    const sellSummary= document.getElementById('sellSummary');
    const gapGrid    = document.getElementById('gapGrid');

    function renderAdList(container, prices, prefix, kind) {
        container.innerHTML = '';
        prices.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'ad-item';
            const priceStr = fmtPrice(p);
            div.innerHTML = `
                <div class="ad-label">
                    <span class="ad-serial">${i + 1}</span>
                    <span>${prefix} ${i + 1}</span>
                </div>
                <div class="ad-price">
                    ${priceStr}
                    <button class="copy-btn" data-copy="${priceStr}" data-label="${prefix} ${i+1}">📋</button>
                </div>
            `;
            container.appendChild(div);
        });
        container.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                copyText(btn.dataset.copy, btn.dataset.label);
            });
        });
    }

    function renderSummary(container, kind, prices) {
        const minV = Math.min(...prices);
        const maxV = Math.max(...prices);
        const color = kind === 'buy' ? '#166534' : '#991b1b';
        container.innerHTML = `
            <span class="sum-pill" style="color:${color}">মোট: ${prices.length}</span>
            <span class="sum-pill" style="color:${color}">সর্বনিম্ন: ${fmtPrice(minV)}</span>
            <span class="sum-pill" style="color:${color}">সর্বোচ্চ: ${fmtPrice(maxV)}</span>
        `;
    }

    function gapRow(label, value, ok) {
        const cls = ok === undefined ? '' : (ok ? 'ok' : 'bad');
        return `<div class="gap-row"><span>${label}</span><span class="v ${cls}">${value}</span></div>`;
    }

    function renderGapInfo(r) {
        const match = Math.abs(r.actualGap - r.gap) < 1e-6;
        gapGrid.innerHTML = [
            gapRow('Buy সর্বোচ্চ Price', fmtPrice(r.maxBuy)),
            gapRow('Sell সর্বনিম্ন Price', fmtPrice(r.minSell)),
            gapRow('প্রকৃত মধ্যবর্তী Gap', fmtPrice(r.actualGap), match),
            gapRow('নির্ধারিত Gap', fmtPrice(r.gap), match),
            gapRow('মার্কেট Range (Min→Max)', `${fmtPrice(r.minP)} → ${fmtPrice(r.maxP)}`),
            gapRow('মোট বরাদ্দ (Ads + Gap)', fmtPrice(r.maxBuy - r.minP + (r.minSell - r.maxBuy) + (r.maxP - r.minSell))),
            gapRow('অবশিষ্ট জায়গা', fmtPrice(r.remainingSpace - (r.maxBuy - r.minP) - (r.maxP - r.minSell) - r.actualGap))
        ].join('');
    }

    function render() {
        errorBox.classList.remove('show');
        let r;
        try {
            r = calculate();
        } catch (err) {
            resultWrap.classList.remove('show');
            errorBox.textContent = '❌ ' + err.message;
            errorBox.classList.add('show');
            lastResult = null;
            return;
        }
        lastResult = r;
        resultWrap.classList.add('show');
        renderSummary(buySummary, 'buy', r.buyPrices);
        renderSummary(sellSummary, 'sell', r.sellPrices);
        renderAdList(buyList, r.buyPrices, 'Buy Ad', 'buy');
        renderAdList(sellList, r.sellPrices, 'Sell Ad', 'sell');
        renderGapInfo(r);
    }

    /* ========================
       COPY ALL
       ======================== */
    function buildBuyText() {
        if (!lastResult) return '';
        return lastResult.buyPrices
            .map((p, i) => `Buy Ad ${i+1}: ${fmtPrice(p)}`).join('\n');
    }
    function buildSellText() {
        if (!lastResult) return '';
        return lastResult.sellPrices
            .map((p, i) => `Sell Ad ${i+1}: ${fmtPrice(p)}`).join('\n');
    }
    function buildAllText() {
        if (!lastResult) return '';
        const r = lastResult;
        return [
            '=== BUY ADS ===',
            buildBuyText(),
            '',
            '=== SELL ADS ===',
            buildSellText(),
            '',
            `Actual Gap: ${fmtPrice(r.actualGap)} (Target: ${fmtPrice(r.gap)})`,
            `Market Range: ${fmtPrice(r.minP)} → ${fmtPrice(r.maxP)}`
        ].join('\n');
    }

    /* ========================
       STATE PERSIST
       ======================== */
    function saveState() {
        const s = {};
        INPUT_IDS.forEach(id => {
            const el = document.getElementById(id);
            if (el) s[id] = el.value;
        });
        storage.set(STORAGE_KEY, s);
    }
    function restoreState() {
        const s = storage.get(STORAGE_KEY, null);
        if (!s) return;
        INPUT_IDS.forEach(id => {
            const el = document.getElementById(id);
            if (el && s[id] !== undefined && s[id] !== null) el.value = s[id];
        });
    }

    /* ========================
       EVENT BINDING
       ======================== */
    document.getElementById('calcBtn').addEventListener('click', () => {
        render();
        if (lastResult) showToast('হিসাব সম্পন্ন');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        storage.remove(STORAGE_KEY);
        document.getElementById('minPrice').value = '100';
        document.getElementById('maxPrice').value = '200';
        document.getElementById('buyCount').value = '4';
        document.getElementById('sellCount').value = '4';
        document.getElementById('buyInterval').value = '10';
        document.getElementById('sellInterval').value = '10';
        document.getElementById('gap').value = '10';
        INPUT_IDS.forEach(id => document.getElementById(id).classList.remove('invalid'));
        render();
        showToast('রিসেট হয়েছে');
    });

    document.getElementById('copyAllBtn').addEventListener('click', () => {
        if (!lastResult) { showToast('আগে হিসাব করুন'); return; }
        copyText(buildAllText(), 'সব (Buy + Sell)');
    });
    document.getElementById('copyAllBuy').addEventListener('click', () => {
        if (!lastResult) { showToast('আগে হিসাব করুন'); return; }
        copyText(buildBuyText(), 'সব Buy');
    });
    document.getElementById('copyAllSell').addEventListener('click', () => {
        if (!lastResult) { showToast('আগে হিসাব করুন'); return; }
        copyText(buildSellText(), 'সব Sell');
    });

    // Live update — ইনপুট বদলালেই রিক্যালকুলেট
    INPUT_IDS.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => {
            el.classList.remove('invalid');
            saveState();
            render();
        });
        el.addEventListener('change', () => {
            saveState();
            render();
        });
    });

    window.addEventListener('beforeunload', saveState);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveState();
    });

    /* ========================
       INIT
       ======================== */
    restoreState();
    render();

    /* ========================
       SERVICE WORKER
       ======================== */
    (function registerSW() {
        if (!('serviceWorker' in navigator)) return;
        if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
        const swCode = `
            const CACHE = 'p2p-ad-calc-v1';
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                    caches.match(e.request).then(cached => {
                        const fetchP = fetch(e.request).then(res => {
                            const copy = res.clone();
                            caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
                            return res;
                        }).catch(() => cached);
                        return cached || fetchP;
                    })
                );
            });
        `;
        try {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        } catch (e) {}
    })();
})();
</script>
</body>
</html>
